<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>오늘 뭐 먹지? | 꼬르륵</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font for authentic Toss styling -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        toss: {
                            blue: '#3182f6',
                            blueHover: '#1b64da',
                            blueLight: '#e8f3ff',
                            grey100: '#f9fafb',
                            grey200: '#f2f4f6',
                            grey300: '#e5e8eb',
                            grey400: '#b0b8c1',
                            grey500: '#8b95a1',
                            grey600: '#6b7684',
                            grey700: '#4e5968',
                            grey800: '#333d4b',
                            grey900: '#191f28',
                        }
                    },
                    boxShadow: {
                        'toss-card': '0 4px 20px 0 rgba(0, 0, 0, 0.04)',
                        'toss-active': '0 8px 30px 0 rgba(49, 130, 246, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f2f4f6;
            color: #191f28;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }

        /* Spring-physics feeling button active state */
        .toss-btn-touch {
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background-color 0.15s ease, border-color 0.15s ease;
        }
        .toss-btn-touch:active {
            transform: scale(0.97);
        }

        /* Slide step animations */
        .step-transition {
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
        }
        .step-enter {
            opacity: 0;
            transform: translateY(12px);
        }
        .step-show {
            opacity: 1;
            transform: translateY(0);
        }
        .step-exit {
            opacity: 0;
            transform: translateY(-12px);
        }

        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

        window.addEventListener('DOMContentLoaded', () => {
            renderCategoryChips();
            renderLocationGrid();
            updateUIState();
        });

        // Render Step 3 Chips
        function renderCategoryChips() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = categoriesData.map(cat => `
                <button onclick="toggleCategory('${cat.id}')" id="cat-${cat.id}" 
                    class="category-card p-4 rounded-2xl border border-toss-grey300 bg-white text-left toss-btn-touch flex flex-col justify-between h-28 shadow-sm">
                    <div class="font-bold text-toss-grey900 text-sm tracking-tight">${cat.label}</div>
                    <div class="text-xs text-toss-grey500">${cat.desc}</div>
                </button>
            `).join('');
        }

        // Render Step 4 Locations
        function renderLocationGrid() {
            const grid = document.getElementById('locationGrid');
            grid.innerHTML = locationsData.map(loc => `
                <button onclick="selectLocation('${loc.id}')" id="loc-${loc.id}" 
                    class="location-card p-4 rounded-2xl border border-toss-grey300 bg-white text-left toss-btn-touch flex flex-col justify-between h-24 shadow-sm">
                    <span class="text-[10px] font-bold text-toss-blue bg-toss-blueLight px-2 py-0.5 rounded-full w-max">${loc.tag}</span>
                    <div class="font-bold text-toss-grey900 text-sm tracking-tight mt-1">${loc.label}</div>
                </button>
            `).join('');
        }

        // Selection Handlers
        function selectMealTime(val) {
            state.mealTime = val;
            document.querySelectorAll('.meal-option-btn').forEach(btn => {
                const isSelected = btn.getAttribute('data-value') === val;
                btn.classList.toggle('border-toss-blue', isSelected);
                btn.classList.toggle('bg-toss-blueLight', isSelected);
                btn.querySelector('.inner-dot').classList.toggle('hidden', !isSelected);
                btn.querySelector('.radio-indicator').classList.toggle('border-toss-blue', isSelected);
            });
            updateNextButton();
        }

        function selectHunger(val) {
            state.hunger = val;
            document.querySelectorAll('.hunger-option-btn').forEach(btn => {
                const isSelected = btn.getAttribute('data-value') === val;
                btn.classList.toggle('border-toss-blue', isSelected);
                btn.classList.toggle('bg-toss-blueLight', isSelected);
                btn.querySelector('.inner-dot').classList.toggle('hidden', !isSelected);
                btn.querySelector('.radio-indicator').classList.toggle('border-toss-blue', isSelected);
            });
            updateNextButton();
        }

        function toggleCategory(id) {
            const index = state.categories.indexOf(id);
            if (index > -1) {
                state.categories.splice(index, 1);
            } else {
                state.categories.push(id);
            }

            const card = document.getElementById(`cat-${id}`);
            const isSelected = state.categories.includes(id);
            card.classList.toggle('border-toss-blue', isSelected);
            card.classList.toggle('bg-toss-blueLight', isSelected);

            updateNextButton();
        }

        function selectLocation(id) {
            state.location = id;
            document.querySelectorAll('.location-card').forEach(card => {
                const isSelected = card.id === `loc-${id}`;
                card.classList.toggle('border-toss-blue', isSelected);
                card.classList.toggle('bg-toss-blueLight', isSelected);
            });
            updateNextButton();
        }

        // Navigation logic
        function goToNextStep() {
            if (state.currentStep < 5) {
                goToStep(state.currentStep + 1);
            }
        }

        function goToPrevStep() {
            if (state.currentStep > 1) {
                goToStep(state.currentStep - 1);
            }
        }

        function goToStep(targetStep) {
            const currentElem = document.getElementById(`step${state.currentStep}`);
            const nextElem = document.getElementById(`step${targetStep}`);

            currentElem.classList.remove('step-show');
            currentElem.classList.add('step-exit');

            setTimeout(() => {
                currentElem.classList.add('hidden');
                currentElem.classList.remove('step-exit');

                nextElem.classList.remove('hidden', 'step-exit');
                nextElem.classList.add('step-enter');

                setTimeout(() => {
                    nextElem.classList.remove('step-enter');
                    nextElem.classList.add('step-show');
                }, 20);

                state.currentStep = targetStep;
                updateUIState();

                if (targetStep === 5) {
                    executeRecommendation();
                }
            }, 180);
        }

        function updateUIState() {
            // Update Progress Bar
            const progress = (state.currentStep / 5) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;

            // Back Button Visibility
            const prevBtn = document.getElementById('prevBtn');
            if (state.currentStep > 1) {
                prevBtn.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                prevBtn.classList.add('opacity-0', 'pointer-events-none');
            }

            // Bottom Bar Button Text & Enable State
            const nextBtn = document.getElementById('nextBtn');
            const bottomBar = document.getElementById('bottomBar');

            if (state.currentStep === 5) {
                bottomBar.classList.add('hidden');
            } else {
                bottomBar.classList.remove('hidden');
                nextBtn.innerText = state.currentStep === 4 ? '추천 결과 보기' : '다음';
                updateNextButton();
            }
        }

        function updateNextButton() {
            const nextBtn = document.getElementById('nextBtn');
            let isValid = false;

            if (state.currentStep === 1) isValid = !!state.mealTime;
            else if (state.currentStep === 2) isValid = !!state.hunger;
            else if (state.currentStep === 3) isValid = state.categories.length > 0;
            else if (state.currentStep === 4) isValid = !!state.location;

            nextBtn.disabled = !isValid;
        }

        // Reset Flow
        function resetFlow() {
            state.mealTime = null;
            state.hunger = null;
            state.categories = [];
            state.location = null;

            document.querySelectorAll('.meal-option-btn, .hunger-option-btn, .category-card, .location-card').forEach(el => {
                el.classList.remove('border-toss-blue', 'bg-toss-blueLight');
                const innerDot = el.querySelector('.inner-dot');
                if (innerDot) innerDot.classList.add('hidden');
            });

            goToStep(1);
        }

        // Recommendation Logic
        function executeRecommendation() {
            const loading = document.getElementById('resultLoading');
            const container = document.getElementById('resultContainer');

            loading.classList.remove('hidden');
            container.classList.add('hidden');

            setTimeout(() => {
                loading.classList.add('hidden');
                container.classList.remove('hidden');

                // Render summary badge
                document.getElementById('summaryBadge').innerText = 
                    `${state.location} · ${state.categories.join(', ')} · ${state.mealTime}`;

                // Filter items
                let filtered = restaurants.filter(r => 
                    r.location === state.location || state.categories.includes(r.category)
                );

                if (filtered.length === 0) {
                    filtered = restaurants.slice(0, 3);
                }

                const listElem = document.getElementById('restaurantList');
                listElem.innerHTML = filtered.map(r => `
                    <div class="p-4 rounded-2xl border border-toss-grey200 bg-white shadow-toss-card space-y-3">
                        <div class="relative h-40 w-full rounded-xl overflow-hidden bg-toss-grey200">
                            <img src="${r.image}" alt="${r.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/e5e8eb/333d4b?text=Food+Image'"/>
                            <span class="absolute top-2.5 left-2.5 bg-toss-grey900/80 text-white text-[11px] font-semibold px-2.5 py-1 rounded-md backdrop-blur-sm">
                                ${r.tag}
                            </span>
                        </div>
                        <div class="flex items-start justify-between">
                            <div>
                                <h3 class="font-bold text-lg text-toss-grey900 tracking-tight">${r.name}</h3>
                                <div class="text-xs text-toss-grey500 mt-0.5">${r.category} · ${r.location} · ${r.price}</div>
                            </div>
                            <div class="flex items-center gap-1 bg-toss-grey100 px-2 py-1 rounded-lg">
                                <span class="text-yellow-400 text-xs">★</span>
                                <span class="text-xs font-bold text-toss-grey900">${r.rating}</span>
                                <span class="text-[10px] text-toss-grey500">(${r.reviewCount})</span>
                            </div>
                        </div>
                        <p class="text-xs text-toss-grey700 leading-relaxed">${r.desc}</p>
                        <a href="https://map.naver.com/v5/search/${encodeURIComponent(r.name + ' ' + r.location)}" target="_blank" 
                            class="block w-full py-3 bg-toss-grey100 hover:bg-toss-grey200 text-toss-grey800 text-center text-xs font-bold rounded-xl toss-btn-touch transition-colors">
                            네이버 지도에서 보기
                        </a>
                    </div>
                `).join('');

            }, 600);
        }
    </script>
</body>
</html>
